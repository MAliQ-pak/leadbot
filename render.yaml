# Render Blueprint: Render reads this file to create the web service.
# Secrets (sync: false) are NOT stored here; Render asks for them when you create the service.
services:
  - type: web
    name: leadbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest
      - key: MODEL
        value: claude-sonnet-5-5
      - key: BUSINESS_NAME
        value: BrightPath Solar
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: LLM_HOURLY_LIMIT
        value: "200"
      - key: MAX_CLAUDE_MESSAGES_PER_CHAT
        value: "30"
