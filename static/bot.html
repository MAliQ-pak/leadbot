<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/bot.css">
</head>
<body>
  <!-- The chat window. A business's website shows it in an iframe (see widget.js); the admin
       panel shows it as the live preview. Everything it says comes from /api/chat. -->
  <div class="panel">
    <header class="head">
      <div class="av" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div class="who"><b id="bot-name">Assistant</b><small id="status">Online, replies instantly</small></div>
      <button id="close" class="x" aria-label="Close chat" hidden>&times;</button>
    </header>
    <div id="msgs" class="msgs" aria-live="polite"></div>
    <div id="quick" class="quick"></div>
    <form id="form" class="form">
      <input id="input" placeholder="Type your message..." autocomplete="off" maxlength="1000" aria-label="Message">
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9z"/></svg>
      </button>
    </form>
    <div class="foot">Powered by <a href="/" target="_blank" rel="noopener">LeadBot</a></div>
  </div>
  <script src="/static/bot.js" defer></script>
</body>
</html>
